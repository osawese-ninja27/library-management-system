<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Library logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="64" height="64" rx="14" fill="#402250"/>
  <g transform="translate(2.5 0)">
    <!-- leaning book (accent) -->
    <rect x="37" y="20" width="9" height="26" rx="1.5" fill="#E77A02" transform="rotate(-10 37 46)"/>
    <!-- standing books -->
    <rect x="13" y="20" width="9" height="26" rx="1.5" fill="#F7F5F2"/>
    <rect x="24" y="14" width="9" height="32" rx="1.5" fill="#F7F5F2"/>
    <!-- spine bands -->
    <rect x="13" y="25" width="9" height="2" fill="#402250"/>
    <rect x="24" y="19" width="9" height="2" fill="#402250"/>
  </g>
  <!-- shelf -->
  <rect x="11" y="47" width="42" height="3" rx="1.5" fill="#F7F5F2"/>
</svg>
